# PipelineGPT — self-hosted production stack.
#
#   ./install.sh            (first time: asks for your domain and API key, generates secrets)
#   docker compose up -d    (afterwards)
#
# Only Caddy publishes ports (80/443). It obtains TLS certificates automatically
# (Let's Encrypt), serves the frontend at / and the API at /backend/*.

name: pipelinegpt

x-backend: &backend
  image: ghcr.io/kubu-ventures/pipelinegpt-backend:${PIPELINEGPT_VERSION:?set PIPELINEGPT_VERSION in .env}
  restart: unless-stopped
  # Uploads wait here until a worker ingests them (shared by api and worker).
  volumes:
    - uploads:/data/uploads
  environment: &backend-env
    ENVIRONMENT: production
    DEMO_MODE: ${DEMO_MODE:-false}
    DATABASE_URL: postgresql+asyncpg://pipelinegpt:${POSTGRES_PASSWORD:?}@postgres:5432/pipelinegpt
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    # AI provider: anthropic | bedrock | vertex. The API refuses to start if the
    # chosen provider's settings are missing (see .env.example).
    LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Bedrock: leave the keys empty to use the host's IAM instance role.
    AWS_REGION: ${AWS_REGION:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # Vertex: the service-account key is mounted by docker-compose.vertex.yml.
    VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
    VERTEX_REGION: ${VERTEX_REGION:-global}
    JWT_SECRET: ${JWT_SECRET:?}
    CORS_ORIGINS: https://${PIPELINEGPT_DOMAIN:?set PIPELINEGPT_DOMAIN in .env}
    MAX_TOKENS_PER_DAY: ${MAX_TOKENS_PER_DAY:-100000}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
    HITL_CONFIDENCE_THRESHOLD: ${HITL_CONFIDENCE_THRESHOLD:-0.75}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # "data" reaches Postgres/Redis; "egress" reaches the Anthropic API and the frontend.
  networks: [data, egress]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PIPELINEGPT_DOMAIN: ${PIPELINEGPT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt account email)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [egress]

  frontend:
    image: ghcr.io/kubu-ventures/pipelinegpt-frontend:${PIPELINEGPT_VERSION}
    restart: unless-stopped
    environment:
      # Server-side sign-in calls go straight to the API container; the browser uses
      # the same-origin /backend path built into the image.
      API_INTERNAL_URL: http://api:8000
      AUTH_SECRET: ${NEXTAUTH_SECRET:?}
      AUTH_URL: https://${PIPELINEGPT_DOMAIN}
      AUTH_TRUST_HOST: "true"
    networks: [egress]

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipelinegpt
      POSTGRES_USER: pipelinegpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinegpt -d pipelinegpt"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  # Task monitor, off by default: `docker compose --profile ops up -d flower`, then open
  # it through an SSH tunnel to 127.0.0.1:5555. Never expose it publicly.
  flower:
    <<: *backend
    profiles: [ops]
    command: ["flower"]
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      disable: true

networks:
  # No internet access; only the backend containers join it.
  data:
    internal: true
  egress: {}

volumes:
  uploads:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
