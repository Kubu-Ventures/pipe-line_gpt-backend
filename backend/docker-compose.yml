# Development stack built from source. For production use deploy/ (see deploy/README.md).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pipelinegpt
      POSTGRES_USER: pipelinegpt
      POSTGRES_PASSWORD: pipelinegpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinegpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pipelinegpt:pipelinegpt@db:5432/pipelinegpt
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["api"]   # applies migrations, then serves on :8000

  celery_worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pipelinegpt:pipelinegpt@db:5432/pipelinegpt
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["worker"]

  flower:
    build: .
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: ["flower"]

volumes:
  pgdata:
