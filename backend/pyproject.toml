[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipelinegpt-backend"
version = "0.2.0"
description = "RAG API for pipeline integrity data with engineer review (HITL)"
license = "AGPL-3.0-only"
authors = [{ name = "Collins Kubu" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pgvector",
    "anthropic[bedrock,vertex]>=0.112",
    "pydantic-settings>=2.7",
    "celery[redis]",
    "flower",
    "pdfplumber",
    "httpx",
    "prometheus-fastapi-instrumentator",
    "python-jose[cryptography]",
    "bcrypt>=4.0",
    "python-multipart",
    "langdetect",
    "presidio-analyzer",
    "presidio-anonymizer",
    "fastembed>=0.3",
    "sentence-transformers",
    "redis",
    "alembic",
    "pyotp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "httpx",
    "ruff>=0.6",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires live Postgres (pgvector) and Redis; run with TEST_DATABASE_URL set",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert is fine in tests
    "E501",   # line length handled by formatter
    "UP042",  # str+Enum -> StrEnum changes str() output; not worth the risk
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
