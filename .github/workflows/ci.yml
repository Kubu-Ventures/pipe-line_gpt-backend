name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - name: shellcheck deploy scripts
        working-directory: .
        run: shellcheck deploy/*.sh backend/docker-entrypoint.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pipelinegpt_test
          POSTGRES_USER: pipelinegpt
          POSTGRES_PASSWORD: pipelinegpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipelinegpt -d pipelinegpt_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pipelinegpt:pipelinegpt@localhost:5432/pipelinegpt_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/requirements-*.txt
      - run: uv venv && uv pip install -r requirements-dev.txt
      - run: uv run --no-project pytest --cov --cov-report=term-missing:skip-covered

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
